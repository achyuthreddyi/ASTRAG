services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: astrag
      POSTGRES_PASSWORD: astrag
      POSTGRES_DB: astrag
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astrag -d astrag"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
